name: auto-merge-dev
# automatically merge the dev branch to main once daily. primary publishing method to preserve build minutes. concurrency: concurrency: concurrency: 
on:
  schedule:
    - cron: '0 0 * * *' # timezone: UTC
  workflow_dispatch: 
  
jobs:
  merge-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: merge dev to main
        run: |
          git checkout main
          git merge origin/dev --no-ff -m "daily merge to main"
          git push origin main
